name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check generated gallery & README
        env:
          PYTHONUTF8: "1"
        run: uv run python gallery/build_gallery.py --check

      - name: Run test suite
        env:
          PYTHONHASHSEED: "0"
          PYTHONUTF8: "1"
        run: uv run pytest -q

  wheel-smoke:
    name: Isolated wheel & sdist smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Verify sdist size and wheel contents
        run: |
          python3 - <<'PY'
          import pathlib, tarfile, zipfile

          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(sdists) == 1 and len(wheels) == 1, (sdists, wheels)

          sdist_size = sdists[0].stat().st_size
          print(f"sdist: {sdists[0].name} ({sdist_size:,} bytes)")
          assert sdist_size < 500_000, f"sdist too large ({sdist_size} bytes)"
          with tarfile.open(sdists[0], "r:gz") as tf:
              names = tf.getnames()
              assert not any("gallery/output" in n for n in names), "gallery/output leaked into sdist"

          with zipfile.ZipFile(wheels[0]) as zf:
              wnames = zf.namelist()
              assert "mintchip/py.typed" in wnames, "mintchip/py.typed missing from wheel"
          PY

      - name: Install wheel in isolated temp venv and smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(cd dist && pwd)/$(ls dist/*.whl | head -n1 | xargs basename)"
          SMOKE_DIR="${RUNNER_TEMP}/mintchip-wheel-smoke"
          PROJECT_DIR="${RUNNER_TEMP}/mintchip-smoke-project"
          rm -rf "$SMOKE_DIR" "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          uv venv "$SMOKE_DIR/.venv" --python 3.12
          uv pip install --python "$SMOKE_DIR/.venv/bin/python" "$WHEEL"

          cd "$RUNNER_TEMP"
          "$SMOKE_DIR/.venv/bin/mintchip" --version
          "$SMOKE_DIR/.venv/bin/mintchip" spark 1.84 1.32 0.96 0.42
          "$SMOKE_DIR/.venv/bin/mintchip" guide | head -n 5
          "$SMOKE_DIR/.venv/bin/mintchip" skill --install --root "$PROJECT_DIR" --target claude
          test -f "$PROJECT_DIR/.claude/skills/mintchip/SKILL.md"
          "$SMOKE_DIR/.venv/bin/python" -c "import mintchip, pathlib; assert (pathlib.Path(mintchip.__file__).parent / 'py.typed').is_file()"
