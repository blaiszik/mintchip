<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 16" width="4.5em" height="1em" role="img" aria-label="Funnel of 4 stages from 1,200 to 290, 24% retained." data-mc="{&quot;chip&quot;:&quot;funnel&quot;,&quot;stages&quot;:{&quot;visited&quot;:1200.0,&quot;signed up&quot;:520.0,&quot;activated&quot;:350.0,&quot;retained&quot;:290.0}}" style="vertical-align:-0.15em;overflow:visible"><title>Funnel of 4 stages from 1,200 to 290, 24% retained.</title><desc>4 stages, 24% of visited reach retained; steepest drop: visited → signed up, 57% lost (680); stage conversion 43%, 67%, 83%</desc><style>svg{color:#1A1D21;--mc-accent:#3B7DDD;--mc-good:#2A9152;--mc-bad:#DC4535;--mc-warn:#B87A00}@media (prefers-color-scheme:dark){svg{color:#E6E9EE;--mc-accent:#5590E8;--mc-good:#31A05C;--mc-bad:#E85A48;--mc-warn:#C08000}}</style><rect x="3.5" y="2.5" width="14.75" height="11" style="fill:currentColor"><title>visited: 1,200 (100%)</title></rect><rect x="20.25" y="8.73" width="14.75" height="4.77" style="fill:var(--mc-accent, #3B7DDD)"><title>signed up: 520 (43%)</title></rect><rect x="37" y="10.29" width="14.75" height="3.21" style="fill:currentColor"><title>activated: 350 (29%)</title></rect><rect x="53.75" y="10.84" width="14.75" height="2.66" style="fill:currentColor"><title>retained: 290 (24%)</title></rect></svg>
