<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26.6 16" width="1.66em" height="1em" role="img" aria-label="2/3 pass across 3 items." data-mc="{&quot;chip&quot;:&quot;strip&quot;,&quot;values&quot;:[&quot;pass&quot;,&quot;fail&quot;,&quot;pass&quot;],&quot;names&quot;:[&quot;lint&quot;,&quot;unit&quot;,&quot;e2e&quot;]}" style="vertical-align:-0.15em;overflow:visible"><title>2/3 pass across 3 items.</title><desc>1 fail; fail: unit</desc><style>svg{color:#1A1D21;--mc-accent:#3B7DDD;--mc-good:#2A9152;--mc-bad:#DC4535;--mc-warn:#B87A00}@media (prefers-color-scheme:dark){svg{color:#E6E9EE;--mc-accent:#5590E8;--mc-good:#31A05C;--mc-bad:#E85A48;--mc-warn:#C08000}}</style><rect x="2.5" y="2.5" width="5.6" height="11" style="fill:var(--mc-good, #2A9152)"><title>lint: pass</title></rect><rect x="10.5" y="11.5" width="5.6" height="2" style="fill:var(--mc-bad, #DC4535)"><title>unit: fail</title></rect><rect x="18.5" y="2.5" width="5.6" height="11" style="fill:var(--mc-good, #2A9152)"><title>e2e: pass</title></rect></svg>
