<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 16" width="4.5em" height="1em" role="img" aria-label="999/1,000 pass (1 fail)." data-mc="{&quot;chip&quot;:&quot;status&quot;,&quot;passed&quot;:999,&quot;failed&quot;:1}" style="vertical-align:-0.15em;overflow:visible"><title>999/1,000 pass (1 fail).</title><desc>999 passed (99.9%); 1 failed (0.1%); 1,000 total</desc><style>svg{color:#1A1D21;--mc-accent:#3B7DDD;--mc-good:#2A9152;--mc-bad:#DC4535;--mc-warn:#B87A00}@media (prefers-color-scheme:dark){svg{color:#E6E9EE;--mc-accent:#5590E8;--mc-good:#31A05C;--mc-bad:#E85A48;--mc-warn:#C08000}}</style><rect x="2.5" y="4" width="64" height="8" style="fill:var(--mc-good, #2A9152)"><title>passed: 999 (99.9%)</title></rect><rect x="67.5" y="4" width="2" height="8" style="fill:var(--mc-bad, #DC4535)"><title>failed: 1 (0.1%)</title></rect></svg>
