<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 16" width="4.5em" height="1em" role="img" aria-label="heatmap of 5 slots from 10 to 90 ms." data-mc="{&quot;chip&quot;:&quot;heat&quot;,&quot;values&quot;:[10.0,null,45.0,90.0,30.0],&quot;unit&quot;:&quot;ms&quot;}" style="vertical-align:-0.15em;overflow:visible"><title>heatmap of 5 slots from 10 to 90 ms.</title><desc>4 slots, range 10 to 90 ms, mean 43.8 ms; peak at slot 4 (90 ms), lowest at slot 1 (10 ms)</desc><style>svg{color:#1A1D21;--mc-accent:#3B7DDD;--mc-good:#2A9152;--mc-bad:#DC4535;--mc-warn:#B87A00}@media (prefers-color-scheme:dark){svg{color:#E6E9EE;--mc-accent:#5590E8;--mc-good:#31A05C;--mc-bad:#E85A48;--mc-warn:#C08000}}</style><rect x="2.5" y="2.5" width="12.8" height="11" style="fill:var(--mc-accent, #3B7DDD);fill-opacity:0.2"><title>slot 1: 10 ms</title></rect><rect x="16.05" y="7.25" width="12.8" height="1.5" style="fill:currentColor;fill-opacity:0.3"><title>slot 2: missing</title></rect><rect x="29.6" y="2.5" width="12.8" height="11" style="fill:var(--mc-accent, #3B7DDD);fill-opacity:0.55"><title>slot 3: 45 ms</title></rect><rect x="43.15" y="2.5" width="12.8" height="11" style="fill:var(--mc-accent, #3B7DDD)"><title>slot 4: 90 ms</title></rect><rect x="56.7" y="2.5" width="12.8" height="11" style="fill:var(--mc-accent, #3B7DDD);fill-opacity:0.4"><title>slot 5: 30 ms</title></rect></svg>
