[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mintchip"
version = "0.2.1"
description = "Word-sized graphics for the numbers in an agent's report: sparklines, intervals, before/after and pass/fail chips in text, Markdown or HTML, from one shell command."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Blaiszik" }]
keywords = [
    "sparklines",
    "word-sized graphics",
    "small multiples",
    "tufte",
    "agents",
    "llm",
    "cli",
    "reporting",
    "svg",
    "unicode",
    "data-visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/blaiszik/mintchip"
Repository = "https://github.com/blaiszik/mintchip"
Documentation = "https://blaiszik.github.io/mintchip/"
Issues = "https://github.com/blaiszik/mintchip/issues"
Changelog = "https://github.com/blaiszik/mintchip/blob/main/CHANGELOG.md"

[project.scripts]
mintchip = "mintchip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mintchip"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "evals",
    "gallery/README.md",
    "gallery/build_gallery.py",
    "scripts",
    "skills",
    "llms.txt",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "gallery/output",
    "gallery/output/**",
    "prototypes",
    "prototypes/**",
    "promo",
    "promo/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["gallery/output", "prototypes"]
